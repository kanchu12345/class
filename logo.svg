<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140" fill="none">
  <!-- Physics Icon Mark -->
  <g transform="translate(10, 10)">
    <!-- Orbit 1 (Solid academic navy) -->
    <ellipse cx="60" cy="60" rx="52" ry="21" transform="rotate(-28 60 60)" stroke="#0B2545" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- Orbit 2 (Subtle dashed companion path) -->
    <ellipse cx="60" cy="60" rx="52" ry="21" transform="rotate(34 60 60)" stroke="#0B2545" stroke-width="3.5" stroke-dasharray="6 7" stroke-linecap="round" fill="none" opacity="0.35"/>
    <!-- Harmonic Sine Wave (Vivid Amber Energy & Wave Mechanics) -->
    <path d="M 12 60 Q 36 24 60 60 T 108 60" stroke="#F5A623" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Core Nucleus & Focal Point -->
    <circle cx="60" cy="60" r="9" fill="#0B2545"/>
    <circle cx="60" cy="60" r="5" fill="#F5A623"/>
    <!-- Active Particle on Upper Orbit (Energetic Teal Accent) -->
    <circle cx="98" cy="40" r="5.5" fill="#17B6A7"/>
    <!-- Quantum Coordinate Marks -->
    <line x1="60" y1="16" x2="60" y2="25" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="95" x2="60" y2="104" stroke="#0B2545" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(142, 0)">
    <!-- Primary Name -->
    <text x="0" y="51" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="31" font-weight="800" fill="#0B2545" letter-spacing="-0.5">SURESH SENANAYAKE</text>
    <!-- Subject & Specialty -->
    <text x="2" y="82" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5A623" letter-spacing="2.8">PHYSICS CLASSES</text>
    <!-- Location Pill -->
    <rect x="2" y="96" width="86" height="22" rx="4" fill="#0B2545"/>
    <text x="45" y="111" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#FAF9F6" text-anchor="middle" letter-spacing="1.2">GAMPAHA</text>
    <!-- Subtitle / Mediums -->
    <text x="100" y="112" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#4B5E76" letter-spacing="0.5">A/L &amp; O/L • ENGLISH &amp; SINHALA MEDIUM</text>
  </g>
</svg>
